<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Bilgilerini Güncelle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Düzenle</h1>
    </header>

    <nav>
        <a href="/index.html">Ana Sayfa</a> | 
        <a href="/etkinlikler.html">Tüm Etkinlikler</a> | 
        <a href="/etkinlik-ekle.html">Yeni Etkinlik Ekle</a>
    </nav>

    <main>
        <form>
            <p>
                <label for="ad">Etkinlik Başlığı:</label><br>
                <input type="text" id="ad" name="ad" value="Yapay Zeka ve Büyük Veri Zirvesi 2026">
            </p>
            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori">
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Yarışma">Yarışma</option>
                </select>
            </p>
            <p>
                <label for="tarih">Tarih ve Saat:</label><br>
                <input type="datetime-local" id="tarih" name="tarih" value="2026-10-14T13:30">
            </p>
            <p>
                <label for="konum">Konum:</label><br>
                <input type="text" id="konum" name="konum" value="Merkez Amfi 1">
            </p>
            <p>
                <label for="kontenjan">Maksimum Kontenjan:</label><br>
                <input type="number" id="kontenjan" name="kontenjan" value="150">
            </p>
            <p>
                <label for="aciklama">Açıklama Metni:</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="50">Üretken yapay zeka modelleri ve büyük veri analitiğinin geleceğine dair uzman sunumları.</textarea>
            </p>
            <button type="submit">Değişiklikleri Kaydet</button>
        </form>
    </main>

    <footer>
        <p>Emircan Tunçay · 2416501018 · 2026</p>
    </footer>
</body>
</html>
